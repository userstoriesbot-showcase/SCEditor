<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />

		<title>SCEditor custom toolbarContainer</title>

		<link rel="stylesheet" href="../minified/themes/default.min.css" />

		<script src="../minified/sceditor.min.js"></script>
		<script src="../minified/icons/monocons.js"></script>
		<script src="../minified/formats/bbcode.js"></script>

		<style>
			html {
				font-family: Arial, Helvetica, sans-serif;
				font-size: 14px;
			}
			body {
				margin: 0;
				padding: 1em 2em;
			}
			.intro {
				height: 260px;
				max-width: 640px;
				line-height: 1.5;
			}
			#toolbar {
				width: 600px;
				padding: 4px;
				margin-bottom: 1.5em;
				border: 2px dashed #3399ff;
				border-radius: 4px;
			}
		</style>
	</head>
	<body>
		<div class="intro">
			<h1>Custom toolbarContainer</h1>
			<p>
				This editor is created with the <code>toolbarContainer</code>
				option, so its toolbar is rendered into the dashed box below,
				outside of the editor.
			</p>
			<p>
				Click the Font button in the toolbar. Its dropdown should open
				directly under the button.
			</p>
		</div>

		<div id="toolbar"></div>

		<textarea id="example" style="height:260px;width:600px;">[b]Custom toolbar[/b]

Click the Font button in the toolbar above.</textarea>

		<script>
			var textarea = document.getElementById('example');
			sceditor.create(textarea, {
				format: 'bbcode',
				icons: 'monocons',
				emoticonsEnabled: false,
				style: '../minified/themes/content/default.min.css',
				toolbarContainer: document.getElementById('toolbar')
			});
		</script>
	</body>
</html>
